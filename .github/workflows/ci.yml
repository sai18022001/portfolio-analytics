### Step 19 — Push to GitHub

Now let's get this on GitHub. First create a `.gitignore` in the root so you don't accidentally commit secrets or node_modules:
```
# .gitignore
backend/venv/
backend/__pycache__/
backend/**/__pycache__/
backend/.env
backend/*.db

frontend/node_modules/
frontend/dist/

.DS_Store
*.pyc